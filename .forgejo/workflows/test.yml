name: Test & Report

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: docker
    container:
      # node:22-slim pinned by digest. Resolved 2026-05-17 via `docker pull`.
      # Refresh quarterly; tag-pinning leaves CI exposed to upstream re-pointing.
      image: node:22-slim@sha256:689c11043dad91472750cd824c97dd5e2318e9dd6f954e492fe7af0135d33ceb
    steps:
      - name: Install Python
        run: |
          apt-get update -qq && apt-get install -y -qq python3 curl >/dev/null 2>&1

      - name: Checkout
        # actions/checkout v4.2.2 pinned by SHA (resolved 2026-05-18).
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run test suites
        run: python3 scripts/ci-test-runner.py > test-findings.json
        continue-on-error: true

      - name: Show results
        run: cat test-findings.json

      - name: Upload to DefectDojo
        if: github.ref == 'refs/heads/main'
        env:
          DD_API_TOKEN: ${{ secrets.DEFECTDOJO_API_TOKEN }}
          DEFECTDOJO_URL: https://defectdojo.internal.homelab.equipment
        run: |
          SCAN_DATE=$(date -u +%Y-%m-%d)

          HTTP_CODE=$(curl -sk -o /tmp/dd-response.json -w "%{http_code}" \
            -X POST "${DEFECTDOJO_URL}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${DD_API_TOKEN}" \
            -F "scan_type=Generic Findings Import" \
            -F "file=@test-findings.json" \
            -F "product_name=autoclaude" \
            -F "product_type_name=Inspicere Projects" \
            -F "engagement_name=CI Tests" \
            -F "auto_create_context=true" \
            -F "scan_date=${SCAN_DATE}" \
            -F "active=true" \
            -F "verified=true" \
            -F "close_old_findings=true" \
            -F "close_old_findings_product_scope=false" \
            -F "deduplication_on_engagement=true")

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Reimport failed (HTTP ${HTTP_CODE}), trying import..."
            HTTP_CODE=$(curl -sk -o /tmp/dd-response.json -w "%{http_code}" \
              -X POST "${DEFECTDOJO_URL}/api/v2/import-scan/" \
              -H "Authorization: Token ${DD_API_TOKEN}" \
              -F "scan_type=Generic Findings Import" \
              -F "file=@test-findings.json" \
              -F "product_name=autoclaude" \
              -F "product_type_name=Inspicere Projects" \
              -F "engagement_name=CI Tests" \
              -F "auto_create_context=true" \
              -F "scan_date=${SCAN_DATE}" \
              -F "active=true" \
              -F "verified=true")
          fi

          echo "DefectDojo response: HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Upload failed:"
            cat /tmp/dd-response.json
            exit 1
          fi

      - name: Fail on test failures
        run: |
          FINDING_COUNT=$(python3 -c "import json; print(len(json.load(open('test-findings.json'))['findings']))")
          if [ "$FINDING_COUNT" -gt 0 ]; then
            echo "FAILED: ${FINDING_COUNT} test failure(s) reported"
            exit 1
          fi
